# configs/camera.yaml
# Thông số camera 1080p60 đã đối chiếu từ bàn cờ + kiểm chứng độ dốc theo chiều sâu
# trên cặp video ngược chiều (IMG_8387 / IMG_8388) với pháp tuyến gương epi_n.
camera:
  K:
    - [1680.0, 0.0, 960.0]
    - [0.0, 1680.0, 540.0]
    - [0.0, 0.0, 1.0]
  dist: [-0.005, 0.040, 0.0, 0.0, 0.0]  # k1 k2 p1 p2 k3
  calib_image_size: [1920, 1080]
  image_size: [1920, 1080]
  aspect_mode: crop